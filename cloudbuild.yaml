steps:
  # ── GATE: tests must pass BEFORE anything deploys ────────────────────────
  # Previously this file deployed the backend as step 1 and ran no tests at all,
  # so a broken build reached production and was discovered there. Cloud Build
  # stops the pipeline on a non-zero step, so these run first by design.
  - name: 'python:3.11'
    id: 'backend-tests'
    dir: 'backend'
    entrypoint: bash
    args:
      - '-c'
      - |
        pip install --quiet -r requirements.txt pytest
        python -m pytest tests/ -q

  - name: 'node:20'
    id: 'frontend-build'
    dir: 'frontend'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm ci
        npx tsc --noEmit -p tsconfig.json
        npm run build

  # Build and deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['backend-tests', 'frontend-build']
    args:
      - 'run'
      - 'deploy'
      - 'medicaid-inspector-api'
      - '--source'
      - '.'
      - '--region'
      - 'us-central1'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '1'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

  # Build frontend
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: npm
    args: ['ci']

  - name: 'node:20'
    dir: 'frontend'
    entrypoint: npm
    args: ['run', 'build']

  # Deploy frontend to Firebase Hosting
  - name: 'gcr.io/firebase-tools/firebase'
    args: ['deploy', '--only', 'hosting']

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
